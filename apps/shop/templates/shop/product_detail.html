
<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>{{ product.name }} - Потужно Shop</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container my-5">
        <a href="{% url 'shop:product_list' %}" class="btn btn-secondary mb-3">&larr; Назад до каталогу</a>
        <div class="card shadow">
            <div class="card-body">
                <h2 class="card-title">{{ product.name }}</h2>
                <h4 class="text-success my-3">{{ product.price }} грн</h4>
                <p class="card-text">{{ product.description }}</p>
                <p><strong>Аудиторія:</strong> {{ product.get_audience_display }}</p>
                <p><strong>Залишок:</strong> {{ product.stock }} шт.</p>
                
                <hr>
                <a href="{% url 'shop:product_update' product.slug %}" class="btn btn-warning">✏️ Редагувати товар</a>
            </div>
        </div>
    </div>
</body>
</html>
