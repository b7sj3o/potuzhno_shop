{% extends 'base.html' %}
{% block title %}Замовлення оформлено — ПОТУЖНО Shop{% endblock %}
{% block content %}
<div class="container text-center py-5">
    <div class="card shadow-sm border-0 p-5 bg-white mx-auto" style="max-width: 600px;">
        <i class="bi bi-check-circle-fill text-success display-1 mb-3"></i>
        <h2 class="fw-bold mb-3">Дякуємо за замовлення!</h2>
        <p class="text-muted mb-4">Ваше замовлення <strong>№{{ order.id }}</strong> успішно створено та передано в обробку.</p>
        <a href="{% url 'shop:product_list' %}" class="btn btn-dark px-4 fw-bold">Повернутися до каталогу</a>
    </div>
</div>
{% endblock %}
