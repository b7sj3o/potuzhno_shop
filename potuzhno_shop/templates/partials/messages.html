{% if messages %}
    <div class="mb-4 position-fixed w-50 start-50 translate-middle">
        {% for message in messages %}
            <div class="alert {% if message.tags %}alert-{{ message.tags }}{% else %}alert-secondary{% endif %} alert-dismissible fade show"
                 role="alert">
                {{ message }}
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Закрити"></button>
            </div>
        {% endfor %}
    </div>
{% endif %}
