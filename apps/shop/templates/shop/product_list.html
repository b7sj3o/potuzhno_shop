
<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Каталог товарів - Потужно Shop</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container my-5">
        <h1 class="mb-4">⚡ Потужно Shop — Каталог</h1>
        <div class="row">
            {% for product in products %}
                <div class="col-md-4 mb-3">
                    <div class="card h-100 shadow-sm">
                        <div class="card-body">
                            <h5 class="card-title">{{ product.name }}</h5>
                            <p class="card-text text-muted">{{ product.description|truncatewords:15 }}</p>
                            <p class="card-text fw-bold text-success">{{ product.price }} грн</p>
                            <a href="{% url 'shop:product_detail' product.slug %}" class="btn btn-primary btn-sm">Детальніше</a>
                        </div>
                    </div>
                </div>
            {% empty %}
                <p>Товарів поки немає.</p>
            {% endfor %}
        </div>
    </div>
</body>
</html>
