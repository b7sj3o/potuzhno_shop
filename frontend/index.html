<!DOCTYPE html><html lang='uk'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width, initial-scale=1.0'><title>ПОТУЖНО Shop</title><script src='https://cdn.tailwindcss.com'></script></head><body class='bg-gray-50 text-gray-900'><header class='bg-black text-white shadow-md sticky top-0 z-50'><div class='container mx-auto px-6 py-4 flex justify-between items-center'><h1 class='text-2xl font-black tracking-wider text-orange-500'>ПОТУЖНО SHOP</h1><div class='flex items-center space-x-6'><select id='langSelect' class='bg-gray-800 text-white px-2 py-1 rounded text-sm'><option value='uk'>🇺🇦 UA</option><option value='en'>🇬🇧 EN</option></select><button onclick='toggleCart()' class='bg-orange-600 px-4 py-2 rounded-lg font-bold hover:bg-orange-700 transition flex items-center space-x-2 text-white'>🛒 <span id='cartCount'>0</span></button></div></div></header><section class='bg-gradient-to-r from-orange-600 to-red-600 text-white py-16 text-center'><div class='container mx-auto px-6'><h2 id='heroTitle' class='text-4xl font-extrabold mb-4'>Преміальний спортивний одяг та взуття</h2><p id='heroSubtitle' class='text-lg opacity-90'>Швидка відправка поштою по всій Україні 🚀</p></div></section><main class='container mx-auto px-6 py-12'><h3 id='catalogTitle' class='text-2xl font-bold mb-8 text-gray-800'>Каталог товарів</h3><div id='productList' class='grid grid-cols-1 md:grid-cols-3 lg:grid-cols-4 gap-6'></div></main><div id='cartModal' class='fixed inset-0 bg-black bg-opacity-50 hidden flex justify-end z-50'><div class='bg-white w-full max-w-md h-full p-6 flex flex-col justify-between shadow-2xl overflow-y-auto'><div><div class='flex justify-between items-center mb-6'><h3 class='text-xl font-bold'>Кошик замовлень</h3><button onclick='toggleCart()' class='text-gray-500 hover:text-black font-bold text-xl'>✕</button></div><div id='cartItems' class='space-y-4 mb-6'></div></div><div><div class='border-t pt-4 mb-4'><div class='flex justify-between font-bold text-lg'><span>Загальна сума:</span><span id='cartTotal'>0 грн</span></div></div><div class='bg-gray-50 p-4 rounded-xl border border-gray-200 mb-4'><h4 class='font-bold mb-3 text-sm text-gray-700'>📦 Дані для відправки (Нова Пошта)</h4><input type='text' id='customerName' placeholder='Ім&#39;я та Прізвище' class='w-full mb-2 p-2 border rounded text-sm'><input type='text' id='customerPhone' placeholder='Номер телефону (+380...)' class='w-full mb-2 p-2 border rounded text-sm'><input type='text' id='customerCity' placeholder='Місто (напр. Київ, Ромни)' class='w-full mb-2 p-2 border rounded text-sm'><input type='text' id='postOffice' placeholder='Номер відділення або поштомату' class='w-full p-2 border rounded text-sm'></div><button onclick='checkoutOrder()' class='w-full bg-orange-600 text-white py-3 rounded-lg font-bold hover:bg-orange-700 transition'>Підтвердити замовлення</button></div></div></div><footer class='bg-gray-900 text-gray-400 py-6 text-center mt-12'><p>&copy; 2026 ПОТУЖНО Shop. All rights reserved.</p></footer><script src='app.js'></script></body></html>
