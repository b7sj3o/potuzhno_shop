{% extends 'base.html' %}
{% block content %}
<div class="max-w-4xl mx-auto">
    <h1 class="text-3xl font-black text-white mb-6">Список улюблених товарів ❤️</h1>
    <div class="bg-gray-800 border border-gray-700 rounded-xl p-6 shadow-xl">
        {% if wishlist_items %}
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                {% for item in wishlist_items %}
                <div class="bg-gray-900 border border-gray-700 p-4 rounded-lg flex justify-between items-center">
                    <div>
                        <h4 class="font-bold text-white">
                            <a href="{% url 'shop:product_detail' item.product.slug %}" class="hover:text-amber-400 transition">{{ item.product.name }}</a>
                        </h4>
                        <span class="text-amber-400 font-semibold">{{ item.product.price }} ₴</span>
                    </div>
                    <a href="{% url 'wishlist:remove_from_wishlist' item.product.id %}" class="text-rose-500 hover:text-rose-400 font-bold text-sm">Видалити</a>
                </div>
                {% endfor %}
            </div>
        {% else %}
            <p class="text-gray-400 text-center py-8">Ви ще нічого не додали до списку «Обране».</p>
        {% endif %}
    </div>
</div>
{% endblock %}
