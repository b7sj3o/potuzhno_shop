{% extends 'base.html' %}
{% block content %}
<div class="max-w-md mx-auto bg-slate-900 border border-slate-800 rounded-2xl p-8 shadow-2xl">
    <h2 class="text-2xl font-black text-white mb-6 text-center">Редагувати відгук ⭐</h2>
    <form method="post" class="space-y-4">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="w-full bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold py-3 rounded-xl transition">Зберегти зміни</button>
    </form>
</div>
{% endblock %}
