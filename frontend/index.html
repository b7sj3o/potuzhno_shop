<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ПОТУЖНО — Стрітстайл & Спортивний одяг</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-zinc-950 text-zinc-100">
    <header class="bg-zinc-900 border-b border-zinc-800 sticky top-0 z-50 backdrop-blur-md bg-opacity-90">
        <div class="container mx-auto px-6 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <span class="text-3xl text-orange-500 font-black tracking-tighter">⚡ ПОТУЖНО</span>
                <span class="text-xs bg-orange-500 text-zinc-950 px-2 py-0.5 rounded uppercase font-black tracking-widest">PRO LUX</span>
            </div>
            <div class="flex items-center space-x-4">
                <button onclick="toggleCart()" class="relative bg-gradient-to-r from-orange-600 to-amber-600 text-white px-4 py-2 rounded-xl font-extrabold hover:opacity-90 transition flex items-center space-x-2 shadow-lg shadow-orange-600/20">
                    <i class="fa-solid fa-bag-shopping"></i> 
                    <span id="cartCount" class="bg-zinc-950 text-orange-500 px-2 py-0.5 rounded-full text-xs font-black">0</span>
                </button>
            </div>
        </div>
    </header>

    <section class="bg-gradient-to-r from-zinc-900 via-zinc-950 to-zinc-900 py-16 text-center border-b border-zinc-800">
        <div class="container mx-auto px-6">
            <h1 id="sectionTitle" class="text-4xl md:text-5xl font-black tracking-tight mb-4 text-white">Каталог товарів</h1>
            <p class="text-zinc-400 text-sm md:text-base max-w-lg mx-auto mb-8">Обирайте категорію: чоловічі, жіночі та дитячі речі 🖤</p>
            
            <div class="flex flex-wrap justify-center gap-3 mb-6">
                <button onclick="switchCategory('all', 'Всі товари каталогу')" class="cat-btn px-5 py-2.5 rounded-xl font-extrabold text-sm bg-orange-600 text-white shadow-md transition">🔥 Всі товари</button>
                <button onclick="switchCategory('clothing', 'Одяг')" class="cat-btn px-5 py-2.5 rounded-xl font-extrabold text-sm bg-zinc-900 text-zinc-300 border border-zinc-800 hover:border-orange-500 transition">👕 Одяг</button>
                <button onclick="switchCategory('shoes', 'Взуття')" class="cat-btn px-5 py-2.5 rounded-xl font-extrabold text-sm bg-zinc-900 text-zinc-300 border border-zinc-800 hover:border-orange-500 transition">👟 Взуття</button>
                <button onclick="switchCategory('accessories', 'Аксесуари')" class="cat-btn px-5 py-2.5 rounded-xl font-extrabold text-sm bg-zinc-900 text-zinc-300 border border-zinc-800 hover:border-orange-500 transition">🎒 Аксесуари</button>
            </div>

            <div class="flex flex-wrap justify-center gap-3">
                <button onclick="switchCategory('male', 'Чоловіча колекція')" class="cat-btn px-4 py-2 rounded-lg font-bold text-xs bg-zinc-900 text-zinc-400 border border-zinc-800 hover:text-white transition">Чоловічі</button>
                <button onclick="switchCategory('female', 'Жіноча колекція')" class="cat-btn px-4 py-2 rounded-lg font-bold text-xs bg-zinc-900 text-zinc-400 border border-zinc-800 hover:text-white transition">Жіночі</button>
                <button onclick="switchCategory('kids', 'Дитяча колекція')" class="cat-btn px-4 py-2 rounded-lg font-bold text-xs bg-zinc-900 text-zinc-400 border border-zinc-800 hover:text-white transition">Дитячі</button>
            </div>
        </div>
    </section>

    <main class="container mx-auto px-6 py-16">
        <div id="productList" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6"></div>
            </section>
    </main>

    <div id="cartModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm hidden flex justify-end z-50">
        <div class="bg-zinc-900 border-l border-zinc-800 w-full max-w-md h-full p-6 flex flex-col justify-between shadow-2xl overflow-y-auto">
            <div>
                <div class="flex justify-between items-center mb-6 border-b border-zinc-800 pb-4">
                    <h3 class="text-xl font-black flex items-center gap-2 text-white"><i class="fa-solid fa-cart-shopping text-orange-500"></i> Кошик</h3>
                    <button onclick="toggleCart()" class="text-zinc-500 hover:text-white text-xl">✕</button>
                </div>
                <div id="cartItems" class="space-y-4 mb-6"></div>
            </div>
            <div>
                <div class="border-t border-zinc-800 pt-4 mb-4">
                    <div class="flex justify-between font-black text-xl text-white">
                        <span>Разом:</span>
                        <span id="cartTotal" class="text-orange-500">0 грн</span>
                    </div>
                </div>
                <button onclick="checkoutOrder()" class="w-full bg-gradient-to-r from-orange-600 to-amber-600 text-white py-3.5 rounded-xl font-black text-base hover:opacity-90 transition shadow-lg shadow-orange-600/30">Оформити замовлення</button>
            </div>
        </div>
    </div>

    <footer class="bg-zinc-900 text-zinc-500 py-10 text-center border-t border-zinc-800 mt-20">
        <p class="text-xs font-bold uppercase tracking-widest">&copy; 2026 ПОТУЖНО Shop. Streetwear & Sportswear.</p>
    </footer>

    <script src="cart.js"></script><script src="products.js"></script><script src="app.js"></script>

    <div id="wishlist-modal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-2xl rounded-2xl p-6 shadow-2xl relative max-h-[80vh] flex flex-col">
            <div class="flex justify-between items-center border-b pb-4 mb-4">
                <h2 class="text-xl font-bold flex items-center gap-2">
                    <i class="fa-solid fa-heart text-red-500"></i> Список «Обране»
                </h2>
                <button onclick="closeWishlistModal()" class="text-gray-400 hover:text-black text-2xl font-bold">&times;</button>
            </div>
            <div id="wishlist-items-container" class="overflow-y-auto flex-1 grid grid-cols-1 sm:grid-cols-2 gap-4">
                </div>
        </div>
    </div>
</body>

</html>
